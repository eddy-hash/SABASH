services:
  db:
    image: postgres:15-alpine
    container_name: sabash_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: sabash_cargo
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - sabash_net

  redis:
    image: redis:7-alpine
    container_name: sabash_redis
    volumes:
      - redisdata:/data
    restart: always
    networks:
      - sabash_net

  backend:
    build: ./backend
    container_name: sabash_api
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/sabash_cargo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3001
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - sabash_net

  frontend:
    build: ./frontend
    container_name: sabash_web
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: always
    networks:
      - sabash_net

  nginx:
    image: nginx:alpine
    container_name: sabash_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - sabash_net

volumes:
  pgdata:
  redisdata:

networks:
  sabash_net:
    driver: bridge
